services:
  - type: web
    name: title-identification
    env: node
    plan: starter
    # prisma stays in dependencies so migrate deploy works after production prune
    buildCommand: npm ci --production=false && npm run build && npm prune --production
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: ~18.18.0
      - key: NODE_ENV
        value: production
      # starter is 0.5 CPU / 512 MB; sharp otherwise sizes its thread pool from
      # the host's core count and runs several resizes of an 18 MP scan at once
      - key: VIPS_CONCURRENCY
        value: "1"
      # set in the dashboard: reusing the old dictionary database will fail the
      # init migration, since that schema is already populated
      - key: DATABASE_URL
        sync: false
